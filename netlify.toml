[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Portuguese site: /pt and /pt/ serve the same page (language is picked from the path); assets resolve to the root files.
# No /pt -> /pt/ redirect: Netlify ignores trailing slashes when matching, so it would loop.
[[redirects]]
  from = "/pt/*"
  to = "/:splat"
  status = 200
