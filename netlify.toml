[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No country routing: logged-out visitors get the homepage language from their browser (index.html: pt-BR -> /br/,
# other pt -> /pt/), and a logged-in user's account language (fm_lang cookie, see track.js) overrides it.
# The language only changes when the user picks one on /account/. Direct links to /pt/ or /br/ are never redirected.

# Brazilian site: /br/ serves the same page as /pt/ and /, with pt-BR text (language is picked from the path).
[[redirects]]
  from = "/br/*"
  to = "/:splat"
  status = 200

# Portuguese site: /pt and /pt/ serve the same page (language is picked from the path); assets resolve to the root files.
# No /pt -> /pt/ redirect: Netlify ignores trailing slashes when matching, so it would loop.
[[redirects]]
  from = "/pt/*"
  to = "/:splat"
  status = 200
